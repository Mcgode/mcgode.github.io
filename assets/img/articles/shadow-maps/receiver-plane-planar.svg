  <style>
    svg { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
    :root { --ink:#1f2328; --muted:#7a828e; --gold:#e3a008; --red:#d62f2f; --green:#1a9a2e; --plane:#1d6fdc; --err:#a21caf; --bg:#ffffff; }
