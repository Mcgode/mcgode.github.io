    .vec-z { stroke: var(--green); stroke-width: 2; fill: none; }
    .err { stroke: var(--err); stroke-width: 3.4; fill: none; stroke-linecap: round; }
    .light-arrow { stroke: var(--gold); stroke-width: 1.6; fill: none; }
    .pS { fill: var(--ink); stroke: var(--bg); stroke-width: 1.2; }
    .pF { fill: var(--ink); stroke: var(--bg); stroke-width: 1.2; }
    .pP { fill: var(--bg); stroke: var(--plane); stroke-width: 2.2; }
